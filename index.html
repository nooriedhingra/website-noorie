    <!-- Flower -->

        <path d="M30,60 Q15,40 20,20 M30,60 Q45,40 40,20" stroke="#27ae60" stroke-width="2" fill="none"/>

    <!-- PS5 Controller -->
    <svg class="draggable-svg" width="60" height="60" viewBox="0 0 60 60" style="left: 200px;">
        <rect x="20" y="10" width="20" height="40" fill="#2c3e50" rx="5" ry="5"/>
        <rect x="20" y="10" width="20" height="15" fill="#ecf0f1" rx="5" ry="5"/>
        <circle cx="30" cy="45" r="3" fill="#2980b9"/>
        <rect x="27" y="50" width="6" height="3" fill="#2980b9"/>
    </svg>

    <!-- JavaScript for Dragging -->
    <script>
        document.addEventListener('DOMContentLoaded', (event) => {
            const draggables = document.querySelectorAll('.draggable-svg');

            draggables.forEach(draggable => {
                let isDragging = false;
                let currentX, currentY, initialX, initialY;
                let xOffset = 0, yOffset = 0;

                draggable.addEventListener('mousedown', dragStart);
                draggable.addEventListener('mouseup', dragEnd);
                draggable.addEventListener('mousemove', drag);
                draggable.addEventListener('mouseleave', dragEnd);

                function dragStart(e) {
                    initialX = e.clientX - xOffset;
                    initialY = e.clientY - yOffset;

                    if (e.target === draggable) {
                        isDragging = true;
                    }
                }

                function dragEnd(e) {
                    initialX = currentX;
                    initialY = currentY;

                    isDragging = false;
                }

                function drag(e) {
                    if (isDragging) {
                        e.preventDefault();

                        currentX = e.clientX - initialX;
                        currentY = e.clientY - initialY;

                        xOffset = currentX;
                        yOffset = currentY;

                        setTranslate(currentX, currentY, draggable);
                    }
                }

                function setTranslate(xPos, yPos, el) {
                    el.style.transform = `translate3d(${xPos}px, ${yPos}px, 0)`;
                }
            });
        });
    </script>
</body>
</html>
