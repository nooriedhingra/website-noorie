<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>noorie dhingra - blog</title>
    <link rel="icon" href="favicon.png" type="image/png">
    <meta property="og:site_name" content="noorie dhingra">
    <meta property="og:title" content="noorie dhingra">
    <meta property="og:type" content="website">
    <meta property="og:description" content="personal website of noorie <3">
    <meta property="og:url" content="https://noorie.me">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../footer.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Inter", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #ffffff;
            color: #1a1a1a;
            line-height: 1.5;
            padding: 40px 30px;
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .post-list {
            list-style: none;
            padding: 0;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .post-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1rem;
        }
        .post-title {
            text-decoration: none;
            color: #1a1a1a;
            display: inline-flex;
            align-items: center;
        }
        .post-title:hover {
            text-decoration: underline;
        }
        .post-title svg {
            width: 1em;
            height: 1em;
            margin-left: 0.5em;
            opacity: 0.6;
        }
        .post-date {
            font-family: monospace;
            color: #888888;
        }
    </style>
</head>
<body>
    <ul class="post-list">
        <li class="post-item">
            <a href="/my-story" class="post-title">My Story</a>
            <span class="post-date">2025/06/25</span>
        </li>
    </ul>

    <div id="footer-placeholder"></div>

    <script>
        fetch('../footer.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('footer-placeholder').innerHTML = data;
            });
    </script>
</body>
</html>
